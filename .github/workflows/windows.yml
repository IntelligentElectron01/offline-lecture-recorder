name: windows

# Installs into a .venv from the hash-pinned lock exactly like setup.bat, then runs the tests that need no special
# hardware (no GPU, models, Ollama, microphone or network). No secrets and no real data are used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev-win-py313.lock

      - name: Install from the lock (hashes required, wheels only)
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/dev-win-py313.lock
          .venv\Scripts\python.exe -m pip install --no-build-isolation --no-deps -e .
          .venv\Scripts\python.exe -m pip check

      - name: Check the install
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m lecture_recorder.cli --version
          .venv\Scripts\python.exe -m lecture_recorder.cli configure --dry-run

      - name: Tests that need no special hardware
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: .venv\Scripts\python.exe -m pytest -q -m "not gpu and not models and not ollama and not private and not network and not mic and not audio" -p no:cacheprovider
