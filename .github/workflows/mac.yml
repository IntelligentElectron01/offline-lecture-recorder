name: macos

# Apple Silicon (macos-14). Installs from the hash-pinned Mac lock, then runs the tests that need no special
# hardware. It only runs once requirements/dev-mac-py313.lock exists. No secrets and no real data are used.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Runs on public repositories (standard macOS runners).
    if: ${{ !github.event.repository.private }}
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there a Mac lock yet?
        id: lock
        run: |
          if [ -f requirements/dev-mac-py313.lock ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.lock.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev-mac-py313.lock

      - name: Install from the lock (hashes required, wheels only)
        if: steps.lock.outputs.present == 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps --only-binary=:all: -r requirements/dev-mac-py313.lock
          .venv/bin/python -m pip install --no-build-isolation --no-deps -e .
          .venv/bin/python -m pip check

      - name: Check the install
        if: steps.lock.outputs.present == 'true'
        run: |
          .venv/bin/python -m lecture_recorder.cli --version
          .venv/bin/python -m lecture_recorder.cli configure --dry-run

      - name: Tests that need no special hardware
        if: steps.lock.outputs.present == 'true'
        run: .venv/bin/python -m pytest -q -m "not gpu and not models and not ollama and not private and not network and not mic and not audio" -p no:cacheprovider
