[build-system]
requires = ["setuptools>=77"]  # 84.0.0 is pinned + hashed in requirements/*.lock (built with --no-build-isolation)
build-backend = "setuptools.build_meta"

[project]
name = "lecture-recorder"
version = "0.1.0"
description = "Offline lecture recorder: record or import audio and get a transcript with speakers, a summary, search and exam-prep notes, all on your own computer."
readme = "README.md"
requires-python = ">=3.13,<3.14"  # the hashed locks are for CPython 3.13
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lecture", "transcription", "speech-to-text", "diarization", "summarization", "offline", "whisper", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Exact, hash-pinned versions live in requirements/*.lock. These are the compatible ranges.
dependencies = [
    "torch>=2.11",
    "torchaudio>=2.11",
    "torchcodec>=0.12",
    "pyannote.audio>=4.0,<5",
    "faster-whisper>=1.2,<2",
    "ctranslate2>=4.6,<5",
    "numpy>=2.0",
    "fastapi>=0.115,<0.142",
    "uvicorn>=0.30",
    "jinja2>=3.1.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.18",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "pywin32>=306; sys_platform == 'win32'",
    "ollama>=0.5",
    "requests>=2.33",
]

[project.urls]
Homepage = "https://github.com/IntelligentElectron01/offline-lecture-recorder"
Documentation = "https://github.com/IntelligentElectron01/offline-lecture-recorder/tree/main/docs"
Issues = "https://github.com/IntelligentElectron01/offline-lecture-recorder/issues"
Changelog = "https://github.com/IntelligentElectron01/offline-lecture-recorder/blob/main/CHANGELOG.md"

[project.scripts]
lecture-recorder = "lecture_recorder.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "jiwer>=4", "pip-audit>=2.7", "psutil>=6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecture_recorder = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU",
    "models: needs downloaded models",
    "ollama: needs a running local Ollama",
    "private: needs optional local recordings (git-ignored)",
    "network: contacts PyPI/OSV (vulnerability scan only)",
    "mic: records 2 s from the default microphone",
    "audio: plays quiet test tones and records them per app (Windows process loopback)",
    "real_power: uses the real power_source (tests/conftest.py makes every other test run plugged in)",
    "real_auth: uses the real local sign-in (tests/conftest.py makes every other test skip it)",
    "mac: needs macOS (skipped everywhere else)",
]
